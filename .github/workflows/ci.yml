name: CI

on:
  workflow_dispatch:
    inputs:
      base:
        description: "Required comparison base commit or ref"
        required: true
        type: string
  push:
    branches: ["**"]
  pull_request:

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Preflight
        run: npm run preflight
